{
  "classes": ["Nothing", "Check White", "Check Black", "Checkmate White", "Checkmate Black"],
  "loss": "cross_entropy",
  "optimizer": {"type": "adam", "lr": 0.001, "weight_decay": 0.0001},
  "training": {"epochs": 50, "batch_size": 128, "val_split": 0.15, "patience": 7},
  "seed": 42,
  "layers": [
    {"type": "normalization"},
    {"type": "linear", "in": 789, "out": 512, "init": "he"},
    {"type": "relu"},
    {"type": "dropout", "rate": 0.3},
    {"type": "linear", "in": 512, "out": 256, "init": "he"},
    {"type": "relu"},
    {"type": "dropout", "rate": 0.3},
    {"type": "linear", "in": 256, "out": 5, "init": "xavier"}
  ]
}
