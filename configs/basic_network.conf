{
  "classes": ["Nothing", "Check"],
  "loss": "cross_entropy",
  "optimizer": {"type": "adam", "lr": 0.001, "weight_decay": 0.0001},
  "training": {"epochs": 30, "batch_size": 128, "val_split": 0.15, "patience": 5},
  "seed": 42,
  "layers": [
    {"type": "normalization"},
    {"type": "linear", "in": 789, "out": 128, "init": "he"},
    {"type": "relu"},
    {"type": "dropout", "rate": 0.2},
    {"type": "linear", "in": 128, "out": 2, "init": "xavier"}
  ]
}
